[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "afp-operations"
version = "0.1.0"
description = "Research-grade AFP/pension operations kernels: policy fixtures, account arithmetic, age transport, FEM, and optional Bayesian smoke models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "googa27"}]
keywords = ["pension", "AFP", "research", "finite-volume", "scikit-fem"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-fem>=10",
]

[project.optional-dependencies]
bayes = ["numpyro>=0.15", "jax>=0.4", "arviz>=0.17"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "build>=1.2"]

[project.scripts]
afp-operations = "afp_operations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/afp_operations"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["afp_operations"]
warn_unused_ignores = false
